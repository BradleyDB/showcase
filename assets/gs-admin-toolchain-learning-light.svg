  <text x="66" y="423" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Oct 15</text>
  <rect x="120" y="466" width="340" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
