  <text x="290" y="334" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">sends nothing, and the vendor's analytics</text>
  <text x="290" y="352" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">show one program at a time</text>
  <rect x="504" y="270" width="340" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
