  <rect x="120" y="386" width="340" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="414" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">Two audits in a row found the same four</text>
