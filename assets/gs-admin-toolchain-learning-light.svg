  <text x="66" y="129" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Oct 18</text>
  <rect x="120" y="172" width="340" height="82" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="200" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">Lessons were lost between one session and</text>
  <text x="290" y="218" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">the next, where a one-session retro can't</text>
  <text x="290" y="236" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">see</text>
  <rect x="504" y="172" width="340" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="674" y="209" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">project-introspect: a retro across every</text>
  <text x="674" y="227" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">session</text>
