  <rect x="504" y="386" width="340" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="674" y="423" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">An audit that finds those four things itself</text>
