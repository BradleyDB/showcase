<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 796" width="880" height="796" role="img" aria-label="Since the last publish, newest first. Oct 18: The pages showed what the system does, not whether it gets better; built: This page: every number re-runs from its command. Oct 17: Lessons were lost between one session and the next, where a one-session retro can't see; built: project-introspect: a retro across every session. Oct 15: A journey program can look healthy while doing nothing: it takes in participants and sends nothing, and the vendor's analytics show one program at a time; built: Engagement dashboards with health signals; they caught a live program failing silently. Oct 15: Two audits in a row found the same four things by hand; built: An audit that finds those four things itself. Oct 12: An urgent fix had to be cherry-picked around work parked on dev; built: Long-lived branches; dev stays shippable. Oct 12: Every fix batch triggered another full code review; built: One code review per release. Oct 11: A round's checks lived in free prose that nothing could read; built: Checks recorded as states at every handoff. Oct 7: The reports missed journeys whose participants come from a Power List; built: Reports follow Power List journeys (v0.43.4)." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Since the last publish, newest first. Oct 18: The pages showed what the system does, not whether it gets better; built: This page: every number re-runs from its command. Oct 17: Lessons were lost between one session and the next, where a one-session retro can't see; built: project-introspect: a retro across every session. Oct 15: A journey program can look healthy while doing nothing: it takes in participants and sends nothing, and the vendor's analytics show one program at a time; built: Engagement dashboards with health signals; they caught a live program failing silently. Oct 15: Two audits in a row found the same four things by hand; built: An audit that finds those four things itself. Oct 12: An urgent fix had to be cherry-picked around work parked on dev; built: Long-lived branches; dev stays shippable. Oct 12: Every fix batch triggered another full code review; built: One code review per release. Oct 11: A round's checks lived in free prose that nothing could read; built: Checks recorded as states at every handoff. Oct 7: The reports missed journeys whose participants come from a Power List; built: Reports follow Power List journeys (v0.43.4).</title>
  <rect width="880" height="796" rx="14" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Since the last publish</text>
  <text x="850" y="30" font-size="13" font-weight="400" fill="#57606a" text-anchor="end">Each problem, and what I built for it</text>
  <text x="120" y="78" font-size="11" font-weight="700" fill="#57606a" text-anchor="start" letter-spacing="1.5">THE PROBLEM</text>
  <text x="504" y="78" font-size="11" font-weight="700" fill="#57606a" text-anchor="start" letter-spacing="1.5">WHAT I BUILT</text>
  <line x1="66" y1="124" x2="66" y2="738" stroke="#8c959f" stroke-width="2"/>
  <rect x="120" y="92" width="340" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="120" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">The pages showed what the system does, not</text>
  <text x="290" y="138" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">whether it gets better</text>
  <rect x="504" y="92" width="340" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="674" y="120" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">This page: every number re-runs from its</text>
