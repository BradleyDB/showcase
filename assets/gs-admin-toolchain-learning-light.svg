  <text x="66" y="218" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Oct 17</text>
  <rect x="120" y="270" width="340" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="298" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">A journey program can look healthy while</text>
