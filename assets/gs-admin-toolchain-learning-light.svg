  <text x="290" y="574" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">Every fix batch triggered another full code</text>
  <text x="290" y="592" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">review</text>
  <rect x="504" y="546" width="340" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
