  <path d="M570 261 L620 261" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="620,261 611,266 611,256" fill="#8c959f"/>
  <path d="M400 286 L400 308" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <polygon points="400,308 395,299 405,299" fill="#8c959f"/>
  <path d="M230 349 L203 349 Q195 349 195 341 L195 285 Q195 277 203 277 L230 277" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <polygon points="230,277 221,282 221,272" fill="#8c959f"/>
  <path d="M570 333 L620 333" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="620,333 611,338 611,328" fill="#d97706"/>
  <path d="M400 358 L400 380" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <polygon points="400,380 395,371 405,371" fill="#8c959f"/>
  <path d="M400 430 L400 452" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <polygon points="400,452 395,443 405,443" fill="#8c959f"/>
  <path d="M400 502 L400 507.5 Q400 513 405.5 513 L739.5 513 Q745 513 745 518.5 L745 524" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <polygon points="745,524 740,515 750,515" fill="#8c959f"/>
  <rect x="230" y="92" width="340" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="113.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">handoff-plan writes the plan: IDs,</text>
  <text x="400" y="130.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">frozen contracts, session map</text>
  <circle cx="230" cy="117" r="12" fill="#2563eb"/>
  <text x="230" y="121.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="620" y="164" width="250" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="745" y="185.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Reviews the plan, starts</text>
  <text x="745" y="202.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">each session</text>
  <circle cx="620" cy="189" r="12" fill="#d97706"/>
  <text x="620" y="193.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="230" y="236" width="340" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="257.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Builder session builds only its</text>
  <text x="400" y="274.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">items, names a judge per fix</text>
  <circle cx="230" cy="261" r="12" fill="#16a34a"/>
  <text x="230" y="265.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="620" y="236" width="250" height="50" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="745" y="257.5" font-size="13.5" font-weight="600" fill="#57606a" text-anchor="middle">Frozen contract must change:</text>
  <text x="745" y="274.5" font-size="13.5" font-weight="400" fill="#57606a" text-anchor="middle">stop, report to a person</text>
  <rect x="230" y="308" width="340" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="329.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Tester session proves the build,</text>
  <text x="400" y="346.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">then verifies or sends it back</text>
  <circle cx="230" cy="333" r="12" fill="#16a34a"/>
  <text x="230" y="337.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="620" y="308" width="250" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="745" y="329.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Steps in when needed:</text>
  <text x="745" y="346.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">tier, defer, WONTFIX</text>
  <rect x="230" y="380" width="340" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="401.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Session records what shipped:</text>
  <text x="400" y="418.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">ledger line, as-shipped notes</text>
  <circle cx="230" cy="405" r="12" fill="#2563eb"/>
  <text x="230" y="409.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="230" y="452" width="340" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="473.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Release: re-decide deferrals,</text>
  <text x="400" y="490.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">review, strip, open the PR</text>
  <circle cx="230" cy="477" r="12" fill="#16a34a"/>
  <text x="230" y="481.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="620" y="524" width="250" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="745" y="545.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Merges the PR, or has</text>
  <text x="745" y="562.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">a session merge it</text>
  <circle cx="620" cy="549" r="12" fill="#d97706"/>
  <text x="620" y="553.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="157.3" y="303" width="75.4" height="20" rx="10" fill="#ffffff"/><text x="195" y="317" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">sent back</text>
  <rect x="365.6" y="359" width="68.8" height="20" rx="10" fill="#ffffff"/><text x="400" y="373" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">verified</text>
  <rect x="30" y="605" width="14" height="14" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="51" y="616.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">handoff-plan</text>
  <rect x="157.8" y="605" width="14" height="14" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="178.8" y="616.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">dev-loop / team-loop session</text>
  <rect x="396" y="605" width="14" height="14" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="417" y="616.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">a person</text>
  <rect x="496.2" y="605" width="14" height="14" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="517.2" y="616.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="start">stop and report</text>
