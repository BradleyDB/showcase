<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 638" width="880" height="638" role="img" aria-label="superfriends process in 7 numbered steps. 1 handoff-plan writes the plan: stable work-item IDs, frozen contracts and a session map. 2 a person reviews the plan and starts each session with its kickoff prompt. 3 a builder session builds only its assigned items and names a judge for each fix; if a frozen contract must change, it stops and reports to a person, who decides on a version bump. 4 a tester session proves which build it loaded, then verifies each fix or sends it back to step 3; a person steps in when needed to set a severity tier, defer a finding or rule it WONTFIX. 5 the session records what shipped: a ledger line and as-shipped notes, the next session’s only memory. 6 the release re-decides deferrals, runs code review, strips dev-only files in one commit and opens the PR, then stops. 7 a person merges the PR, or has a session merge it." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>superfriends process in 7 numbered steps. 1 handoff-plan writes the plan: stable work-item IDs, frozen contracts and a session map. 2 a person reviews the plan and starts each session with its kickoff prompt. 3 a builder session builds only its assigned items and names a judge for each fix; if a frozen contract must change, it stops and reports to a person, who decides on a version bump. 4 a tester session proves which build it loaded, then verifies each fix or sends it back to step 3; a person steps in when needed to set a severity tier, defer a finding or rule it WONTFIX. 5 the session records what shipped: a ledger line and as-shipped notes, the next session’s only memory. 6 the release re-decides deferrals, runs code review, strips dev-only files in one commit and opens the PR, then stops. 7 a person merges the PR, or has a session merge it.</title>
  <rect width="880" height="638" rx="14" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">How one piece of work moves through the process skills</text>
  <text x="850" y="30" font-size="13" font-weight="400" fill="#57606a" text-anchor="end">superfriends</text>
  <text x="230" y="66" font-size="11" font-weight="700" fill="#57606a" text-anchor="start" letter-spacing="1.5">MACHINES PROPOSE</text>
  <text x="620" y="66" font-size="11" font-weight="700" fill="#57606a" text-anchor="start" letter-spacing="1.5">A PERSON DECIDES</text>
