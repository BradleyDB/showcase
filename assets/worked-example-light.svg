<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Timeline of CLI 1.0.10. Sep 17: the vendor ships. Sep 21: the audit maps the impact and recommends adopting. Sep 22: the audit catches its own error and re-runs, and a person decides to adopt. Sep 26: AI sessions build and test it, a tester sends a fix back, and a person approves release v0.43.0. Oct 4: the root cause of the Sep 22 error is fixed. 9 days from vendor release to a safely shipped fix, with 2 errors caught before release." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
