  <text x="445" y="94" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Weekly check of the vendor's releases</text>
  <circle cx="285" cy="89" r="12" fill="#2563eb"/>
  <text x="285" y="93.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
