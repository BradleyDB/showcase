<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 682" width="880" height="682" role="img" aria-label="gs-fortress flow. 1 a weekly check of the vendor's releases asks: new version? If not, it stops quietly and writes nothing; if the check fails, a loud alert fires after 3 failures in a row. If yes: 2 a mechanical diff of the new version; 3 one AI assessment against the impact checklist; 4 mechanical checks on the assessment, and if any fails it stops and records nothing. If they pass, the ledger records decision pending, and a person decides adopt or defer. On adopt, 5 the plugin repo builds it with builder and tester sessions, and 6 a close-out script records what shipped back in the ledger." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>gs-fortress flow. 1 a weekly check of the vendor's releases asks: new version? If not, it stops quietly and writes nothing; if the check fails, a loud alert fires after 3 failures in a row. If yes: 2 a mechanical diff of the new version; 3 one AI assessment against the impact checklist; 4 mechanical checks on the assessment, and if any fails it stops and records nothing. If they pass, the ledger records decision pending, and a person decides adopt or defer. On adopt, 5 the plugin repo builds it with builder and tester sessions, and 6 a close-out script records what shipped back in the ledger.</title>
  <rect width="880" height="682" rx="14" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">What happens when the vendor ships</text>
  <text x="850" y="30" font-size="13" font-weight="400" fill="#57606a" text-anchor="end">gs-fortress</text>
