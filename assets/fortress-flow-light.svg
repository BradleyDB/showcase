  <text x="445" y="534.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">builder and tester sessions</text>
  <circle cx="285" cy="521" r="12" fill="#16a34a"/>
  <text x="285" y="525.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="285" y="568" width="320" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="445" y="589.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Close-out script records</text>
  <text x="445" y="606.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">what shipped</text>
  <circle cx="285" cy="593" r="12" fill="#2563eb"/>
  <text x="285" y="597.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="260.9" y="151" width="29.2" height="20" rx="10" fill="#ffffff"/><text x="275.5" y="165" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">no</text>
  <rect x="554.9" y="151" width="95.19999999999999" height="20" rx="10" fill="#ffffff"/><text x="602.5" y="165" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">check failed</text>
  <rect x="427.1" y="187" width="35.8" height="20" rx="10" fill="#ffffff"/><text x="445" y="201" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">yes</text>
  <rect x="214.5" y="367" width="49" height="20" rx="10" fill="#ffffff"/><text x="239" y="381" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">fails</text>
