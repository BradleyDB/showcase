  <text x="118" y="157.5" font-size="13.5" font-weight="600" fill="#57606a" text-anchor="middle">Stop quietly:</text>
  <text x="118" y="174.5" font-size="13.5" font-weight="400" fill="#57606a" text-anchor="middle">nothing written</text>
  <rect x="660" y="136" width="190" height="50" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="755" y="157.5" font-size="13.5" font-weight="600" fill="#57606a" text-anchor="middle">Loud alert after</text>
