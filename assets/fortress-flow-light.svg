  <text x="445" y="373.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Mechanical checks</text>
  <text x="445" y="390.5" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">on the assessment</text>
  <circle cx="285" cy="377" r="12" fill="#2563eb"/>
  <text x="285" y="381.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="30" y="352" width="176" height="50" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="118" y="373.5" font-size="13.5" font-weight="600" fill="#57606a" text-anchor="middle">Stop: nothing</text>
  <text x="118" y="390.5" font-size="13.5" font-weight="400" fill="#57606a" text-anchor="middle">recorded</text>
  <rect x="285" y="424" width="320" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
