  <text x="270" y="66" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1.5">MACHINES PROPOSE</text>
  <text x="630" y="66" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1.5">A PERSON DECIDES</text>
