<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 782" width="880" height="782" role="img" aria-label="dev-utils loop in 9 numbered steps. 1 a tester session logs a finding. 2 a person sets the round: which findings, in what order. 3 a builder session fixes it, naming how the fix will be judged. 4 dev-utils checks the rules, and refuses a rule-breaking fix back to step 3. 5 dev-utils hands the build to the tester with a token. 6 the tester session verifies that exact build, or sends it back to step 3; a person steps in when needed to send a fix back, defer it or rule it WONTFIX. 7 the dev-utils release runs the gates and opens the PR. 8 a person merges the PR, or has a session merge it. 9 dev-utils tags the release, only after the merge." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>dev-utils loop in 9 numbered steps. 1 a tester session logs a finding. 2 a person sets the round: which findings, in what order. 3 a builder session fixes it, naming how the fix will be judged. 4 dev-utils checks the rules, and refuses a rule-breaking fix back to step 3. 5 dev-utils hands the build to the tester with a token. 6 the tester session verifies that exact build, or sends it back to step 3; a person steps in when needed to send a fix back, defer it or rule it WONTFIX. 7 the dev-utils release runs the gates and opens the PR. 8 a person merges the PR, or has a session merge it. 9 dev-utils tags the release, only after the merge.</title>
